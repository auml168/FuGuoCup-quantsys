name: Public data smoke test
on:
  push:
    paths:
      - 'src/fullgoal_quant/**'
      - 'config/settings.json'
      - '.github/workflows/data-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: fq doctor --limit 12
      - run: fq --data data/smoke research
      - run: fq --data data/smoke report --research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-data-evidence-${{ github.run_id }}
          path: |
            data/smoke/snapshot.json
            data/smoke/universe.json
            reports/research/
          retention-days: 14
          if-no-files-found: ignore
