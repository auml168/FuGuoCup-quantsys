name: Trading day reports
on:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '20 6 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      send:
        description: '向Telegram发送；盘前/盘后仅作观察'
        type: boolean
        default: false
      research:
        description: '研究模式；比赛规则未核验时强制使用'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: fund-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Offline regression tests (no secrets)
        run: python -m unittest discover -s tests -v
      - name: Restore trusted persistent delivery state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_notification_state.py
      - name: Collect full supported universe, evaluate and reserve report
        env:
          ACCOUNT_JSON: ${{ secrets.ACCOUNT_JSON }}
          FQ_SCHEDULE: ${{ github.event.schedule }}
          FQ_EVENT: ${{ github.event_name }}
          FQ_SEND: ${{ inputs.send }}
          FQ_RESEARCH: ${{ inputs.research }}
        run: python scripts/cloud_run.py
      - name: Persist reservation before Telegram side effect
        uses: actions/upload-artifact@v4
        with:
          name: notification-state-reserved
          path: runtime/notification-state.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Deliver reserved report (default branch only)
        if: github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cloud_send.py
      - name: Persist delivery result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-state-final
          path: runtime/notification-state.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Public research evidence (no account report/outbox)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.run_id }}
          path: |
            reports/research/
            data/snapshot.json
            data/universe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Failure alert, including setup/test failures
        if: failure() && github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/failure_notice.py
